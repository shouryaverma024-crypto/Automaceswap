
name: Build AutoMaceSwap 26.2

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Extract project
        run: |
          unzip AutoMaceSwap-1.7-26.2-source.zip
          cd AutoMaceSwap
          gradle build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AutoMaceSwap-26.2
          path: AutoMaceSwap/build/libs/*.jar
